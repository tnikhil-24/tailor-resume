<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Tailor</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <h1>Resume Tailor</h1>

    <div class="form">
      <div class="row">
        <div class="field">
          <label for="job_title">Job Title</label>
          <input id="job_title" type="text" placeholder="e.g. Software Engineer" />
        </div>
        <div class="field">
          <label for="company">Company</label>
          <input id="company" type="text" placeholder="e.g. Google" />
        </div>
      </div>

      <div class="field">
        <label for="jd">Job Description</label>
        <textarea id="jd" rows="12" placeholder="Paste the full job description here..."></textarea>
      </div>

      <button id="tailor-btn" onclick="tailor()">Tailor Resume</button>
    </div>

    <div id="results" class="hidden">
      <div class="section-card">
        <div class="section-header">
          <span class="section-title">Professional Summary</span>
          <div class="section-actions">
            <button id="summary-accept" class="btn-accept" onclick="decideSummary(true)">Accept</button>
            <button id="summary-reject" class="btn-reject" onclick="decideSummary(false)">Reject</button>
          </div>
        </div>
        <div id="summary-diff" class="diff-content"></div>
      </div>

      <div id="experience-section" class="section-card hidden">
        <div class="section-header">
          <span class="section-title">Work Experience</span>
        </div>
        <div id="experience-content"></div>
      </div>

      <div id="skills-section" class="section-card hidden">
        <div class="section-header">
          <span class="section-title">Skills</span>
          <span class="section-subtitle">Reordered by relevance</span>
        </div>
        <div id="skills-preview" class="skills-preview"></div>
        <div id="skills-additions"></div>
      </div>

      <div id="projects-section" class="section-card hidden">
        <div class="section-header">
          <span class="section-title">Projects</span>
          <span id="projects-counter" class="section-subtitle">Select 1–3</span>
        </div>
        <div id="projects-content"></div>
      </div>

      <div id="optional-sections" class="hidden">
        <div id="optional-content"></div>
      </div>

      <div id="gaps-section" class="section-card hidden">
        <div class="section-header">
          <span class="section-title">Gaps</span>
          <span class="section-subtitle">From JD — not in your resume</span>
        </div>
        <div id="gaps-content"></div>
      </div>

      <div class="generate-bar">
        <button id="generate-btn" onclick="generateResume()" disabled>Generate Tailored Resume</button>
        <span id="generate-hint" class="hint">Review all sections above to enable</span>
      </div>
    </div>
  </div>

  <script src="/diff_match_patch.js"></script>
  <script src="/app.js"></script>
</body>
</html>
